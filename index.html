<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Shiba Gamer Overlay</title>
<style>
  :root{
    --fur:#E8A04C; --cream:#FFF3DF; --outline:#1E1B1B; --hoodie:#1C1C24;
    --accent:#D9262E; --stripe:#2F5BEA; --glow:#3AA0FF; --key:#F4F4F6;
    --keyPress:#3AA0FF; --desk:#2A2E3F; --pad:#8E93A0; --mouse:#F4F4F6;
  }
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
  svg{width:100%;height:100%;display:block}

  /* line weights */
  .ol {stroke:var(--outline);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
  .ol2{stroke:var(--outline);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;fill:none}
  .ol3{stroke:var(--outline);stroke-width:1.8;stroke-linecap:round;fill:none;opacity:.55}

  .fur{fill:var(--fur)} .cream{fill:var(--cream)} .hoodie{fill:var(--hoodie)}
  .accent{fill:var(--accent)} .ink{fill:var(--outline)} .stripeF{fill:var(--stripe)}
  .deskF{fill:var(--desk)} .pad{fill:var(--pad)} .mousebody{fill:var(--mouse)}
  .shade{fill:#000;opacity:.13} .shade2{fill:#000;opacity:.25} .shine{fill:#fff;opacity:.22}

  .glowstroke{stroke:var(--glow);fill:none;filter:drop-shadow(0 0 4px var(--glow))}
  .glowfill{fill:var(--glow);filter:drop-shadow(0 0 4px var(--glow))}
  .hot .glowstroke,.hot .glowfill{filter:drop-shadow(0 0 9px var(--glow)) drop-shadow(0 0 3px var(--glow))}

  /* keys */
  .keycap{fill:var(--key)}
  .keyface{fill:var(--key);transition:fill .05s}
  .keytop{transition:transform .05s}
  .key.down .keytop{transform:translateY(4px)}
  .key.down .keyface{fill:var(--keyPress);filter:drop-shadow(0 0 6px var(--keyPress))}
  .label{font:900 19px "Segoe UI","Arial Rounded MT Bold",system-ui,sans-serif;fill:var(--outline);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .label.small{font-size:13px;letter-spacing:3px}
  .hideLabels .label{display:none}

  .btn{fill:transparent;transition:fill .05s}
  .btn.down{fill:var(--keyPress)}

  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
  #breath{animation:breath 3.2s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
</style>
</head>

<script>
(() => {
  // When this page is hosted elsewhere (e.g. GitHub Pages), talk to the program on this PC.
  const params = new URLSearchParams(location.search);
  const API = params.get('api') || (location.port === '8765' ? '' : 'http://127.0.0.1:8765');
  if (params.get('bg')) document.body.style.background = '#' + params.get('bg').replace('#','');
  const root = document.documentElement;
  const svg = document.getElementById('scene');
  const head = document.getElementById('head');
  const mouseEl = document.getElementById('mouse');
  const btnL = document.getElementById('btnL'), btnR = document.getElementById('btnR');
  const desk = document.getElementById('desk');
  const burst = document.getElementById('burst');
  const keyEls = {};
  document.querySelectorAll('.key').forEach(k => keyEls[k.dataset.k] = k);

  const KEY_POS = { w:[115,326], a:[63,378], s:[115,378], d:[167,378], space:[115,428] };
  const SHOULDER_L = [222,262], SHOULDER_R = [418,262];
  const IDLE_L = [182,322];
  const MOUSE_HOME = [520,386];

  let cfg = { sensitivity:0.25, headTilt:true };
  let st = { w:0,a:0,s:0,d:0,space:0,lmb:0,rmb:0,mx:null,my:null };
  let lastKey = null;
  let pawL = IDLE_L.slice(), pawR = MOUSE_HOME.slice();
  let ox = 0, oy = 0;
  let hotUntil = 0;

  function applyConfig(c){
    cfg = Object.assign(cfg, c);
    for (const k of ['fur','cream','outline','hoodie','accent','stripe','glow','key','keyPress','desk','pad','mouse'])
      if (c[k]) root.style.setProperty('--'+k, c[k]);
    desk.style.display = cfg.showDesk === false ? 'none' : '';
    svg.classList.toggle('hideLabels', cfg.showLabels === false);
  }

  function onState(s){
    for (const k of ['w','a','s','d','space']){
      if (s[k] && !st[k]) { lastKey = k; hotUntil = performance.now() + 250; }
      keyEls[k].classList.toggle('down', !!s[k]);
    }
    if (st.mx !== null){
      const sens = cfg.sensitivity ?? 0.25;
      ox += (s.mx - st.mx) * sens;
      oy += (s.my - st.my) * sens;
    }
    if ((s.lmb && !st.lmb) || (s.rmb && !st.rmb)) hotUntil = performance.now() + 250;
    btnL.classList.toggle('down', !!s.lmb);
    btnR.classList.toggle('down', !!s.rmb);
    burst.setAttribute('opacity', (s.lmb || s.rmb) ? 1 : 0);
    st = s;
    if (lastKey && !st[lastKey]) lastKey = ['w','a','s','d','space'].find(k => st[k]) || null;
  }

  function seg(line, sh, p, a, b){
    const len = Math.hypot(p[0]-sh[0], p[1]-sh[1]) || 1;
    const t1 = Math.max(0, 1 - a/len), t2 = Math.max(0, 1 - b/len);
    line.setAttribute('x1', sh[0] + (p[0]-sh[0])*t1); line.setAttribute('y1', sh[1] + (p[1]-sh[1])*t1);
    line.setAttribute('x2', sh[0] + (p[0]-sh[0])*t2); line.setAttribute('y2', sh[1] + (p[1]-sh[1])*t2);
  }

  function placeArm(id, sh, p, pressed){
    const g = document.getElementById(id);
    g.querySelectorAll('.armOl,.armFill').forEach(l => seg(l, sh, p, 1e9, 0));
    seg(g.querySelector('.armShine'), [sh[0]-6, sh[1]-4], [p[0]-6, p[1]-4], 1e9, 40);
    seg(g.querySelector('.cuff'), sh, p, 44, 22);
    seg(g.querySelector('.cuff2'), sh, p, 33, 28);
    const ang = Math.atan2(p[1]-sh[1], p[0]-sh[0]) * 180/Math.PI - 90;
    g.querySelector('.paw').setAttribute('transform',
      `translate(${p[0]} ${p[1]}) rotate(${ang*0.35}) scale(${pressed ? 0.92 : 1})`);
  }

  function frame(){
    ox = Math.max(-55, Math.min(55, ox)) * 0.86;
    oy = Math.max(-26, Math.min(30, oy)) * 0.86;
    const mx = MOUSE_HOME[0] + ox, my = MOUSE_HOME[1] + oy;
    mouseEl.setAttribute('transform', `translate(${mx} ${my})`);

    const clicking = !!(st.lmb || st.rmb);
    const targetR = [mx + (st.rmb && !st.lmb ? 8 : st.lmb ? -6 : 0), my - 10 + (clicking ? 4 : 0)];
    pawR[0] += (targetR[0] - pawR[0]) * 0.6;
    pawR[1] += (targetR[1] - pawR[1]) * 0.6;

    const targetL = lastKey ? [KEY_POS[lastKey][0], KEY_POS[lastKey][1] + 16] : IDLE_L;
    pawL[0] += (targetL[0] - pawL[0]) * 0.55;
    pawL[1] += (targetL[1] - pawL[1]) * 0.55;

    placeArm('armL', SHOULDER_L, pawL, !!lastKey);
    placeArm('armR', SHOULDER_R, pawR, clicking);

    const tilt = cfg.headTilt === false ? 0 : ox * 0.09;
    head.setAttribute('transform', `translate(0 ${lastKey ? 2 : 0}) rotate(${tilt} 320 220)`);
    svg.classList.toggle('hot', performance.now() < hotUntil);
    requestAnimationFrame(frame);
  }

  function connect(){
    const es = new EventSource(API + '/events');
    es.onmessage = e => onState(JSON.parse(e.data));
    es.addEventListener('config', e => applyConfig(JSON.parse(e.data)));
    es.onerror = () => { es.close(); setTimeout(connect, 1500); };
  }
  fetch(API + '/config').then(r => r.json()).then(d => applyConfig(d.config)).catch(()=>{});
  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
